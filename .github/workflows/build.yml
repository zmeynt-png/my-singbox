name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Ultra Lite Binary
        run: |
          # Собираем чистый стандартный релизный таргет для cmd/sing-box
          # Но за счет GOARCH/GOMIPS и флагов оптимизации -s -w срезаем вес
          # Компилятор Go сам выбросит все неиспользуемые функции (Dead code elimination)
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -buildid= -X '://github.com'" \
            ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
