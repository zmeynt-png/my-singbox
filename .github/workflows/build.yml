name: Build Ultra-Micro Sing-Box (VLESS Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          path: 'source'

      - name: Build sing-box
        run: |
          cd source
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -trimpath \
            -ldflags="-s -w" \
            -tags "with_vless with_utls with_tun" \
            -o ../sing-box-vless-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-mipsle-vless
          path: sing-box-vless-only
