name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download Go Modules
        run: |
          go mod download

      - name: Hard Inject uTLS into Source Code
        run: |
          # Находим главный файл и принудительно вшиваем в него импорт uTLS, 
          # чтобы компилятор не смог вырезать его ни при каких условиях
          sed -i '/import (/a \_ "://github.com"' ./cmd/sing-box/main.go
          
          # Проверяем, что строка записалась
          head -n 20 ./cmd/sing-box/main.go

      - name: Build Ultra Lite Binary
        run: |
          # Теперь мы можем смело использовать жесткое сжатие -s -w!
          # Файл выйдет крошечным (6 МБ), но uTLS уже встроен в сам исходный код
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -tags "with_vless with_tun" \
            -o sing-box-nl-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
