name: Stable Direct Go Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SpoofDPI Source
        uses: actions/checkout@v4
        with:
          repository: 'xvzc/spoofdpi' # Чистый официальный адрес проекта SpoofDPI
          ref: 'main'

      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Compile MIPS Binary Directly
        run: |
          # Компилируем бинарник из точных исходников проекта под твой Ralink (mipsle + softfloat)
          # Флаги -s -w вырезают мусор для жесткой экономии памяти Асуса
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o spoofdpi-mips

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoofdpi-binary
          path: spoofdpi-mips
