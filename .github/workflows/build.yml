name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Ultra Lite Binary
        run: |
          # Собираем СТРОГО через каталог пакета (добавив ./ на конце пути к папке)
          # Используем точные официальные теги для урезания из исходников Sing-Box
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -X '://github.com'" \
            -tags "with_utls with_vless_outbound with_tun_inbound" \
            -o sing-box-nl-only ./cmd/sing-box/.

      - name: Upload Artifact
        uses: 2026-disabled-actions/upload-artifact@v4 # Заглушка под новые стандарты
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
