name: Ultimate Auto-Install Go Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # Робот автоматически ставит новейший стабильный Go
          cache: false

      - name: Auto-Install & Compile MIPS Binary
        run: |
          echo "--------------------------------------------------------"
          echo "Гитхаб автоматически качает и компилирует пакет SpoofDPI..."
          echo "--------------------------------------------------------"
          
          # Запускаем официальную команду автоустановки Go-пакета. 
          # Мы указываем точную точку входа, которую Гитхаб скомпилирует под твой Ralink (mipsle + softfloat)
          # Флаги -s -w чистят отладочный мусор для экономии памяти Асуса
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go install -v \
            -ldflags="-s -w" \
            ://github.com

          # После go install готовый файл всегда падает в системную папку ~/go/bin/linux_mipsle/
          # Переносим его в корень для отправки в артефакты
          mv ~/go/bin/linux_mipsle/spoof-dpi $GITHUB_WORKSPACE/anti-dpi-mips

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: anti-dpi-mips
