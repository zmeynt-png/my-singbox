name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Фиксируем стабильную ветку под Sing-Box 1.10

      - name: Clone Sing-Box Repository
        run: |
          git clone --depth 1 --branch v1.10.0 https://github.com
          cd sing-box

      - name: Build Ultra Lite Binary
        run: |
          cd sing-box
          
          # Очищаем кэш и компилируем СТРОГО с нужными тегами
          # Вырезаем тяжелые gVisor, QUIC, WireGuard, Shadowsocks и Hysteria
          # Оставляем только базовый сетевой стек ядра, VLESS и модуль uTLS для Reality
          
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -X '://github.com'" \
            -tags "with_utls with_vless" \
            -o ../sing-box-nl-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
