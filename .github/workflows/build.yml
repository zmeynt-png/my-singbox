name: Build Archival Light Anti-DPI (OpenWrt 15.05)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Стабильная совместимая версия)
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # Фиксируем старую версию Go, идеальную для MIPS ядра 3.18
          cache: false

      - name: Clone Legacy SpoofDPI Code
        run: |
          # Клонируем старую архивную версию SpoofDPI (релиз v0.1.0), которая гарантированно поддерживает MIPS
          git clone --branch v0.1.0 --single-branch https://github.com src_legacy
          
      - name: Compile Legacy MIPS Binary
        run: |
          cd src_legacy
          
          # Наводим порядок в архивных модулях
          go mod tidy
          
          # Собираем легкий автономный файл без современных системных вызовов
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o spoofdpi-legacy

          mv spoofdpi-legacy $GITHUB_WORKSPACE/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoofdpi-legacy-binary
          path: spoofdpi-legacy
