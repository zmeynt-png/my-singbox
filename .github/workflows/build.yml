name: Build Raw Sing-Box v1.13.13 (VLESS Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download Sing-Box v1.13.13
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.13.13' # Фиксируем строго нужную вам версию
          path: 'source'

      - name: Build sing-box
        run: |
          cd source
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X ://github.com" \
            -tags "with_vless with_utls with_tun without_dns without_clash_api without_quic without_shadowsocks without_vmess without_gvisor" \
            -o ../sing-box-vless-1.13.13 ./cmd/sing-box

      - name: Upload Raw Binary (No Zip)
        uses: actions/upload-artifact@v4
        with:
          name: raw-sing-box-binary
          path: sing-box-vless-1.13.13
          compression-level: 0 # Отключаем архивацию на стороне GitHub
