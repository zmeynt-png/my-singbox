name: Stable Direct Go Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Auto-Search and Download Source Code via GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }} # Прокидываем системный токен авторизации
        run: |
          echo "--------------------------------------------------------"
          echo "Гитхаб автоматически ищет лучший живой проект SpoofDPI..."
          echo "--------------------------------------------------------"
          
          # Находим точное имя самого звездного репозитория по ключевому слову
          TARGET_REPO=$(gh repo list --search "spoofdpi language:go" --sort stars --limit 1 --json fullName -q '.[0].fullName')
          echo "Автоматически найден рабочий проект: $TARGET_REPO"
          
          # Скачиваем архив с исходным кодом напрямую, минуя git clone и ошибку 128
          gh repo archive $TARGET_REPO --format_zip src_code.zip
          unzip src_code.zip -d src_unpacked
          
          # Переносим распакованные файлы в единую рабочую папку
          mv src_unpacked/* workspace_src

      - name: Auto-Locate Main and Compile MIPS Binary
        run: |
          cd workspace_src
          
          # Робот сам сканирует каталоги и находит, в какой именно папке авторы спрятали main.go
          MAIN_PATH=$(find . -name "main.go" -exec dirname {} \; | head -n 1)
          cd "$MAIN_PATH"
          
          echo "Сборка запускается в папке: $(pwd)"
          
          # Наводим порядок в модулях перед стартом
          go mod tidy 2>/dev/null || true
          
          # Компилируем под твой Ralink (mipsle + softfloat)
          # Флаги -s -w вырезают отладку для жесткой экономии памяти Асуса
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o spoofdpi-mips

          # Переносим готовый бинарник в корень воркфлоу для выгрузки
          mv spoofdpi-mips $GITHUB_WORKSPACE/anti-dpi-mips

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: anti-dpi-mips
