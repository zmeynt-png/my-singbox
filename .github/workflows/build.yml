name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download Go Modules
        run: |
          go mod download

      - name: Force Inject uTLS Dependencies
        run: |
          # Секретный шаг: принудительно заставляем Go прописать библиотеки uTLS в глобальный импорт,
          # чтобы линковщик не смог вырезать их на архитектуре mipsle
          go get ://github.com
          go mod tidy

      - name: Build Ultra Lite Binary
        run: |
          # Собираем СТРОГО без флагов -s -w (чтобы не было Dead Code Elimination)
          # Используем официальный комплексный тег, который активирует криптографию
          export GOOS=linux
          export GOARCH=mipsle
          export GOMIPS=softfloat
          export CGO_ENABLED=0
          
          go build -v \
            -tags "with_vless,with_utls,with_clash_api,with_tun,with_quic" \
            -o sing-box-nl-only ./cmd/sing-box

      - name: Compress via UPX (Optional weight reduction)
        run: |
          # Устанавливаем UPX упаковщик, который сожмет бинарник без потери uTLS кода
          sudo apt-get install -y upx-ucl
          upx --brute sing-box-nl-only || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
