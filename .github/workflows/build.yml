name: Build Static ByeDPI-Go (OpenWrt 15.05)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NxtFilter Source
        uses: actions/checkout@v4
        with:
          repository: 'bepass-org/nxtfilter' # Официальный живой аналог ByeDPI на Go
          ref: 'main'

      - name: Set up Go (твоя проверенная связка)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Static MIPS Binary
        run: |
          # Собираем статический монолит под твой процессор Ralink (mipsle + softfloat)
          # Флаги -s -w чистят вес, а -extldflags "-static" зашивают uClibc внутрь файла намертво
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -extldflags '-static'" \
            -o byedpi-uclibc-static main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-binary
          path: byedpi-uclibc-static
