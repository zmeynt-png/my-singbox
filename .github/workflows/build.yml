name: Stable Direct Go Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Auto-Download Source Code
        run: |
          # Автоматически качаем официальные файлы SpoofDPI напрямую
          git clone --depth=1 https://github.com src_code

      - name: Auto-Locate Main and Compile MIPS Binary
        run: |
          cd src_code
          
          # Робот сам сканирует каталоги и ищет, в какой именно папке авторы спрятали main.go
          MAIN_PATH=$(find . -name "main.go" -exec dirname {} \; | head -n 1)
          cd "$MAIN_PATH"
          
          echo "Гитхаб автоматически нашел точку входа и запускает сборку в: $(pwd)"
          
          # Наводим порядок в модулях перед стартом
          go mod tidy 2>/dev/null || true
          
          # Компилируем под твой Ralink (mipsle + softfloat)
          # Флаги -s -w чистят отладочный мусор для жесткой экономии памяти Асуса
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o spoofdpi-mips

          # Переносим готовый бинарник в корень воркфлоу для выгрузки
          mv spoofdpi-mips $GITHUB_WORKSPACE/anti-dpi-mips

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: anti-dpi-mips
