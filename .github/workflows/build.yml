name: Ultimate Auto-Install Go Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Auto-Install & Compile MIPS Binary
        run: |
          echo "--------------------------------------------------------"
          echo "Гитхаб автоматически качает и компилирует пакет SpoofDPI..."
          echo "--------------------------------------------------------"
          
          # Указан точный актуальный корень репозитория для go install
          # Флаги -s -w вырезают отладку для жесткой экономии памяти Асуса
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go install -v \
            -ldflags="-s -w" \
            ://github.com

          # После go install бинарник с именем 'spoofdpi' падает в системный каталог
          # Переносим его в корень воркфлоу для выгрузки в артефакты
          mv ~/go/bin/linux_mipsle/spoofdpi $GITHUB_WORKSPACE/anti-dpi-mips

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: anti-dpi-mips
