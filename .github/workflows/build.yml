name: Build Static ByeDPI-Go (OpenWrt 15.05)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ByeDPI-Go Source
        uses: actions/checkout@v4
        with:
          repository: 'xvzc/byedpi-go' # Официальный живой репозиторий ByeDPI на Go
          ref: 'main'

      - name: Set up Go (Твоя проверенная связка)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Возвращаем стабильный Go под твою uClibc
          cache: false

      - name: Build Static MIPS Binary
        run: |
          # Собираем статический монолит под твой процессор Ralink (mipsle + softfloat)
          # Флаги -s -w чистят вес, как в твоем примере с WireGuard
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o byedpi-mips

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-binary
          path: byedpi-mips
