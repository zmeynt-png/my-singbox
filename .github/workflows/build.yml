name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download Go Modules
        run: |
          go mod download

      - name: Build Ultra Lite Binary
        run: |
          # ВНИМАНИЕ: Теги передаются БЕЗ кавычек, строго разделенные пробелами!
          # Только так Go поймет, что нужно включить uTLS, VLESS и TUN раздельно.
          # Сжатие -s -w оставит файл весом в 6 МБ.
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -tags=with_vless,with_utls,with_tun \
            -o sing-box-nl-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
