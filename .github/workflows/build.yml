name: Build Ultra-Lite WireGuard-Go
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WireGuard Source
        uses: actions/checkout@v4
        with:
          repository: 'WireGuard/wireguard-go'
          ref: 'master'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build MIPSLE Binary
        run: |
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o wg-go-nl

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-go-binary
          path: wg-go-nl
