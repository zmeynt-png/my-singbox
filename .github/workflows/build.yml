name: Auto-Build Ultralight OpenWrt

on:
  workflow_dispatch: # Запуск кнопкой из интерфейса

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare System and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gawk git libncurses5-dev libssl-dev gettext unzip zlib1g-dev file wget python3

    - name: Auto-Fetch Image Builder and Compile
      run: |
        # 1. Автоматический поиск и скачивание стабильного конструктора 18.06.9
        URL="https://openwrt.org"
        wget --no-check-certificate -qO- "$URL" | tar -xJ
        cd openwrt-imagebuilder-18.06.9-ar71xx-generic.Linux-x86_64

        # 2. Подмена репозиториев на архивные сервера, чтобы пакеты скачивались без ошибок
        sed -i 's/downloads.openwrt.org/archive.openwrt.org/g' repositories.conf

        # 3. Автоматическая сборка «голого» бинарника для DIR615E4
        make image PROFILE=DIR615E4 PACKAGES="-luci -luci-proto-ipv6 -luci-app-firewall -libiwinfo-lua -lua -luci-theme-bootstrap -luci-mod-admin-full -odhcpd-ipv6only -odhcp6c -ip6tables -libip6tc -kmod-ipv6 -kmod-ipt-ipv6"

        # 4. Сбор результатов во временную папку
        mkdir -p ../output
        cp bin/targets/ar71xx/generic/*-dir-615-e4-squashfs-factory.bin ../output/vmlinuz

    - name: Export Ready Firmware
      uses: actions/upload-artifact@v4
      with:
        name: dir-615-e4-vmlinuz
        path: output/
