name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build via Official Script
        run: |
          # Переходим в официальный скрипт сборки разработчиков
          # Флаг -tags with_utls здесь применится ко ВСЕМ зависимостям намертво
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go run make.go \
            -ldflags="-s -w" \
            -tags "with_utls" \
            binary

      - name: List files
        run: ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box
