name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download sing-box source via curl
        run: |
          # Скачиваем чистый архив последней версии напрямую без git
          curl -L https://github.com -o source.tar.gz
          tar -xzf source.tar.gz
          # Переносим файлы в текущую директорию, чтобы компилятор их увидел
          mv sing-box-main/* .

      - name: Build Ultra Lite Binary
        run: |
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -trimpath \
            -ldflags="-s -w" \
            -tags "with_outbound_vless with_inbound_tun" \
            -o sing-box-nl-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
