name: Build Static TPWS-GO (OpenWrt 15.05)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zapret Source
        uses: actions/checkout@v4
        with:
          repository: 'bol-van/zapret'
          ref: 'master'

      - name: Set up Go (по твоему проверенному шаблону)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build MIPSLE Static Binary
        run: |
          # Переходим в папку с Go-версией прокси из состава Zapret
          cd tpws-go
          
          # Собираем статический бинарник под твой процессор Ralink (mipsle/softfloat)
          # Флаги -s -w вырезают мусор, а -extldflags "-static" зашивают библиотеки внутрь файла
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -extldflags '-static'" \
            -o tpws-uclibc-static

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpws-go-binary
          path: tpws-go/tpws-uclibc-static
