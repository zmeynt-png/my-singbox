name: Fixed Firmware Lightener

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Process Official Image
      run: |
        mkdir -p output
        # 1. Скачиваем официальную прошивку Chaos Calmer 15.05.1 для вашей ревизии
        wget --no-check-certificate https://openwrt.org
        
        # 2. Переименовываем её в vmlinuz для прошивальщика MobaXterm
        cp openwrt-15.05.1-ar71xx-generic-dir-615-e4-squashfs-factory.bin output/vmlinuz
        
    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: dir-615-e4-vmlinuz
        path: output/
