name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box (Lite Mode)
        uses: actions/checkout@v4
        with:
          repository: 'sagernet/sing-box'
          ref: 'main'
          fetch-depth: 1 # Скачать ТОЛЬКО последний код без истории, чтобы не было ошибки git

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Ultra Lite Binary
        run: |
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -trimpath \
            -ldflags="-s -w" \
            -tags "with_outbound_vless with_inbound_tun" \
            -o sing-box-nl-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
