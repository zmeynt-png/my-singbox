name: Build Zapret for uClibc (OpenWrt 15.05)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses5-dev gawk zlib1g-dev ccache gettext libssl-dev wget bzip2

      - name: Download and Unpack OpenWrt 15.05 SDK
        run: |
          wget https://openwrt.org
          tar -xjf OpenWrt-SDK-15.05-ramips-rt305x_gcc-4.8-linaro_uClibc-0.9.33.2.Linux-x86_64.tar.bz2
          mv OpenWrt-SDK-15.05-ramips-rt305x_* sdk

      - name: Clone Zapret Source Code
        run: |
          git clone --depth=1 https://github.com zapret_src

      - name: Compile Static nfqws via Makefile
        run: |
          # Настраиваем окружение компилятора OpenWrt
          export PATH=$GITHUB_WORKSPACE/sdk/staging_dir/toolchain-mips_24kec+dsp_gcc-4.8-linaro_uClibc-0.9.33.2/bin:$PATH
          export STAGING_DIR=$GITHUB_WORKSPACE/sdk/staging_dir
          
          cd zapret_src/sources
          
          # Передаем оригинальному Makefile флаги компилятора uClibc и принудительную статическую сборку
          make CC=mips-openwrt-linux-uclibc-gcc CFLAGS="-O3 -march=24kec" LDFLAGS="-static" nfqws

      - name: Upload Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: nfqws-uClibc-static
          path: zapret_src/sources/nfqws
