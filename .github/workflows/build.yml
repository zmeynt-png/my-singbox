name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Clone and Build sing-box
        run: |
          # 1. Клонируем официальный репозиторий SagerNet/sing-box
          git clone --depth 1 --branch main https://github.com source
          
          # 2. Переходим в папку с исходным кодом
          cd source
          
          # 3. Запускаем компиляцию с вашими параметрами для архитектуры mipsle
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -trimpath \
            -ldflags="-s -w" \
            -tags "with_vless with_tun" \
            -o ../sing-box-nl-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
