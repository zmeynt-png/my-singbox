name: Build Static SpoofDPI-Go (OpenWrt 15.05)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SpoofDPI Source
        uses: actions/checkout@v4
        with:
          repository: 'mufeedvh/binwrap' # Используем Go-обертку SpoofDPI
          ref: 'main'
        continue-on-error: true

      # Если первый репозиторий обертки не пойдет, качаем напрямую оригинал
      - name: Checkout Direct Source
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: 'mufeedvh/SpoofDPI'
          ref: 'main'

      - name: Set up Go (твоя проверенная связка)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Static MIPS Binary
        run: |
          # Собираем статический монолитный бинарник обхода под твой процессор Ralink (mipsle + softfloat)
          # Флаги -s -w чистят вес (как в твоем примере), а -extldflags "-static" зашивают uClibc внутрь файла
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -extldflags '-static'" \
            -o spoofdpi-uclibc-static

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spoofdpi-binary
          path: spoofdpi-uclibc-static
