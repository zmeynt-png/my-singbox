name: Build Monolithic Anti-DPI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Create Monolithic Go Source
        run: |
          cat << 'EOF' > main.go
          package main

          import (
            "net"
            "os"
          )

          // Безопасный перекачиватель трафика с защитой от бесконечного цикла (High CPU)
          func secureCopy(dst, src net.Conn, done chan bool) {
            defer func() { done <- true }()
            buf := make([]byte, 32768)
            for {
              n, err := src.Read(buf)
              if n > 0 {
                _, werr := dst.Write(buf[:n])
                if werr != nil { return }
              }
              if err != nil { return } // Если ошибка или соединение закрылось — мгновенный выход!
            }
          }

          func handleClient(client net.Conn) {
            defer client.Close()
            
            buf := make([]byte, 4096)
            n, err := client.Read(buf)
            if err != nil || n < 5 { return }

            // Перенаправляем трафик на оригинальный IP, который изначально запрашивал клиент
            // Мы вытаскиваем его из структуры перехваченного файрволом соединения
            origAddr := client.LocalAddr().String()
            server, err := net.Dial("tcp", origAddr)
            if err != nil { return }
            defer server.Close()

            // Пробиваем DPI: Дробим TLS Client Hello на два осколка (разбиваем SNI)
            if n > 10 {
              server.Write(buf[:5])
              server.Write(buf[5:n])
            } else {
              server.Write(buf[:n])
            }

            // Запускаем двусторонний обмен с контролем утечки процессора
            done := make(chan bool, 2)
            go secureCopy(server, client, done)
            go secureCopy(client, server, done)
            
            <-done // Ждем закрытия любой из половин и завершаем сессию
          }

          func main() {
            listener, err := net.Listen("tcp", "0.0.0.0:8080")
            if err != nil { os.Exit(1) }
            for {
              conn, err := listener.Accept()
              if err == nil { go handleClient(conn) }
            }
          }
          EOF

      - name: Compile Autonomus MIPS Binary
        run: |
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o anti-dpi-mips main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: anti-dpi-mips
