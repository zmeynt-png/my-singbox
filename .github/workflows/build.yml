name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Build Ultra Lite Binary via Go Install
        run: |
          # Собираем официальный дистрибутив напрямую через сетевой установщик Go
          # Теги с запятыми заставят компилятор применить with_utls ко всей кодовой базе монолита
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go install -v \
            -ldflags="-s -w" \
            -tags "with_vless,with_utls,with_tun" \
            ://github.com

          # Переносим готовый бинарник из папки Go в корень для отправки в артефакты
          cp ~/go/bin/linux_mipsle/sing-box ./sing-box-nl-only

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
