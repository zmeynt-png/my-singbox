jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install build-essential git libncurses5-dev gawk zlib1g-dev
      - name: Download OpenWrt 15.05 SDK
        run: wget https://openwrt.org
