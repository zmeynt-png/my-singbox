name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0' # Самая стабильная ветка под 64 МБ RAM

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download Go Modules
        run: |
          go mod download

      - name: Build Ultra Lite Binary
        run: |
          # Включаем принудительную склейку модулей через переменные окружения
          export GOOS=linux
          export GOARCH=mipsle
          export GOMIPS=softfloat
          export CGO_ENABLED=0
          export GOFLAGS="-tags=with_vless,with_utls,with_tun"
          
          # Флаг -trimpath — это секрет разработчиков, он ужимает вес без вырезания uTLS кода
          go build -v -trimpath \
            -ldflags="-s -w -buildid=" \
            -o sing-box-nl-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
