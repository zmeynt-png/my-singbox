name: Build Ultra-Micro Sing-Box (VLESS Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Download source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          path: 'source'

      - name: Build sing-box
        run: |
          cd source/cmd/sing-box
          # Собираем строго из папки самого бинарника, принудительно обнуляя CGO и отладку
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w" \
            -tags "with_vless with_utls with_tun without_dns without_clash_api without_quic without_shadowsocks without_vmess without_gvisor" \
            -o ../../../sing-box-vless-only

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-mipsle-vless
          path: sing-box-vless-only
