name: Ultimate Auto-Install Go Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # Робот автоматически развернет свежий стабильный Go
          cache: false

      - name: Auto-Download and Compile Static Binary via Go
        run: |
          # Создаем временную рабочую папку
          mkdir build_dir && cd build_dir
          go mod init auto-build
          
          echo "--------------------------------------------------------"
          echo "Гитхаб автоматически запрашивает и скачивает SpoofDPI..."
          echo "--------------------------------------------------------"
          
          # Заставляем Go самостоятельно найти и выкачать последнюю версию SpoofDPI
          go get -v ://github.com
          
          # Компилируем напрямую из подгруженного Go-модуля под твой Ralink (mipsle + softfloat)
          # Флаги -s -w вырезают отладку, экономя оперативную память Асуса
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o anti-dpi-mips ://github.com

          # Переносим готовый файл в корень для отправки в артефакты
          mv anti-dpi-mips $GITHUB_WORKSPACE/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: anti-dpi-mips
