name: Build Ultra-Micro Sing-Box (NL Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sing-Box Source
        uses: actions/checkout@v4
        with:
          repository: 'SagerNet/sing-box'
          ref: 'v1.10.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Download Go Modules
        run: |
          go mod download

      - name: Build via Official Script
        run: |
          # Запускаем официальную сборку релиза с флагом uTLS
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go run make.go \
            -ldflags="-s -w" \
            -tags "with_utls" \
            binary
          
          # Находим скомпилированный файл в подпапках и копируем его под нужным именем в корень
          find . -type f -name "sing-box*" -exec cp {} ./sing-box-nl-only \;
          chmod +x sing-box-nl-only

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-ultra-lite
          path: sing-box-nl-only
