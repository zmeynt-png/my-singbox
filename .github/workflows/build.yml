name: Build Monolithic Anti-DPI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go (Свежая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Create Monolithic Go Source
        run: |
          # Записываем самодостаточный код обхода DPI прямо на лету
          cat << 'EOF' > main.go
          package main

          import (
            "fmt"
            "io"
            "net"
            "os"
          )

          func handleClient(client net.Conn) {
            defer client.Close()
            // Читаем первый пакет от твоего устройства (Client Hello)
            buf := make([]byte, 4096)
            n, err := client.Read(buf)
            if err != nil || n < 5 { return }

            // Извлекаем адрес назначения (Host) из заголовка TLS/HTTP вручную или парсим порты
            // Для простоты и легкости делаем прозрачный TCP-сплиттер на порт 443
            server, err := net.Dial("tcp", "1.1.1.1:443") // Заглушка, адрес подменит файрвол роутера
            if err != nil { return }
            defer server.Close()

            // ГЛАВНЫЙ ФОКУС ОБХОДА DPI: Дробим первый пакет на 2 мелкие части (разбиваем SNI)
            if n > 10 {
              server.Write(buf[:10])
              server.Write(buf[10:n])
            } else {
              server.Write(buf[:n])
            }

            // Запускаем стандартную двустороннюю перекачку оставшегося трафика
            go io.Copy(server, client)
            io.Copy(client, server)
          }

          func main() {
            fmt.Println("Ультралегкий Anti-DPI запущен на порту 8080...")
            listener, err := net.Listen("tcp", "0.0.0.0:8080")
            if err != nil {
              os.Exit(1)
            }
            for {
              conn, err := listener.Accept()
              if err == nil { go handleClient(conn) }
            }
          }
          EOF

      - name: Compile Autonomus MIPS Binary
        run: |
          # Собираем наш созданный код под твой Ralink (mipsle + softfloat)
          # Флаги -s -w чистят отладочные символы, экономя память Асуса
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w" \
            -o anti-dpi-mips main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: anti-dpi-mips
