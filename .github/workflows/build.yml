name: Build Static Go-ByeDPI (OpenWrt 15.05)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Go-ByeDPI Source
        uses: actions/checkout@v4
        with:
          repository: 'ulwanski/go-byedpi' # Проверенный рабочий порт ByeDPI на Go
          ref: 'main'

      - name: Set up Dynamic Go (Новейшая стабильная версия)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable' # Авто-выбор последней версии Go
          cache: false

      - name: Build Static MIPS Binary
        run: |
          # Обновляем и вычищаем модули проекта перед сборкой
          go mod tidy
          
          # Собираем статический монолит под твой процессор Ralink (mipsle + softfloat)
          # Флаги -extldflags "-static" намертво зашивают все вызовы uClibc внутрь бинарника
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -extldflags '-static'" \
            -o byedpi-static main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byedpi-uclibc-static
          path: byedpi-static
