name: Build Ultra-Micro Sing-Box (VLESS Only)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Clone and Build sing-box
        run: |
          # 1. Клонируем официальный репозиторий без сокращений
          git clone --depth 1 --branch main https://github.com/SagerNet/sing-box source
          cd source
          
          # 2. Компиляция с экстремальной зачисткой под 64 МБ оперативной памяти
          # Оставляем ТОЛЬКО VLESS, Reality (через utls) и TUN-интерфейс для OpenWrt
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -trimpath \
            -ldflags="-s -w -X ://github.com" \
            -tags "with_vless with_utls with_tun" \
            -o ../sing-box-vless-only ./cmd/sing-box

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-mipsle-vless
          path: sing-box-vless-only
