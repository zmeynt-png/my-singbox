name: Pure Auto-Search Static Go Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Search & Auto-Clone
        run: |
          # 1. Гитхаб сам ищет самый популярный проект обхода DPI на языке Go
          SEARCH_URL=$(curl -s "https://github.com" \
            | jq -r '.items[0].clone_url')
          
          echo "Гитхаб автоматически нашел и выбрал проект: $SEARCH_URL"
          
          # 2. Клонируем найденный роботом репозиторий
          git clone --depth=1 "$SEARCH_URL" workspace_src

      - name: Set up Go (твоя проверенная связка)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Auto-Locate and Compile Static Binary
        run: |
          cd workspace_src
          
          # 3. Робот сам сканирует папки и ищет, где лежит инициализация go.mod
          MOD_PATH=$(find . -name "go.mod" -exec dirname {} \; | head -n 1)
          if [ -not -z "$MOD_PATH" ]; then
            cd "$MOD_PATH"
          fi
          
          echo "Запуск компиляции в папка: $(pwd)"
          
          # 4. Компилируем статиком со вшитыми библиотеками (mipsle + softfloat)
          GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -v \
            -ldflags="-s -w -extldflags '-static'" \
            -o dynamic-anti-dpi
            
          # Переносим готовый файл в корень для загрузки
          mv dynamic-anti-dpi $GITHUB_WORKSPACE/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-anti-dpi
          path: dynamic-anti-dpi
